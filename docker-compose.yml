name: guarani

services:
  db:
    image: postgres:14-bookworm
    container_name: guarani_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=LATIN1 --locale=C"
      TZ: America/Argentina/Buenos_Aires
    command:
      - postgres
      - -c
      - bytea_output=escape
      - -c
      - timezone=America/Argentina/Buenos_Aires
    ports:
      - "${DB_PORT_HOST}:5432"
    volumes:
      - guarani_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30

  gestion:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: guarani_gestion
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: America/Argentina/Buenos_Aires
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      GESTION_PORT: ${GESTION_PORT}
      TOBA_PASSWORD: ${TOBA_PASSWORD}
      TOBA_SALT: ${TOBA_SALT}
    ports:
      - "${GESTION_PORT}:80"
    volumes:
      - guarani_instalacion:/opt/guarani/instalacion
      - guarani_www:/opt/guarani/www
      - guarani_temp:/opt/guarani/temp
      - guarani_metadatos:/opt/guarani/metadatos_compilados
      - guarani_fw_www:/opt/guarani/vendor/siu-toba/framework/www
      - guarani_fw_temp:/opt/guarani/vendor/siu-toba/framework/temp
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost/guarani/3.23/"]
      interval: 30s
      timeout: 10s
      start_period: 600s
      retries: 10

volumes:
  guarani_pgdata:
  guarani_instalacion:
  guarani_www:
  guarani_temp:
  guarani_metadatos:
  guarani_fw_www:
  guarani_fw_temp:
