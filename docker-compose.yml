name: guarani

services:
  db:
    image: postgres:14-bookworm
    container_name: guarani_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=LATIN1 --locale=C"
      TZ: America/Argentina/Buenos_Aires
    command:
      - postgres
      - -c
      - bytea_output=escape
      - -c
      - timezone=America/Argentina/Buenos_Aires
    ports:
      - "${DB_PORT_HOST}:5432"
    volumes:
      - guarani_pgdata:/var/lib/postgresql/data
      - ./docker/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30

  gestion:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: guarani_gestion
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: America/Argentina/Buenos_Aires
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      GESTION_PORT: ${GESTION_PORT}
      URL_3W: "http://localhost:${W3_PORT:-8091}${AUTOGESTION_ALIAS:-/3w}"
      TOBA_PASSWORD: ${TOBA_PASSWORD}
      TOBA_SALT: ${TOBA_SALT}
    ports:
      - "${GESTION_PORT}:80"
    volumes:
      - guarani_instalacion:/opt/guarani/instalacion
      - guarani_www:/opt/guarani/www
      - guarani_temp:/opt/guarani/temp
      - guarani_metadatos:/opt/guarani/metadatos_compilados
      - guarani_fw_www:/opt/guarani/vendor/siu-toba/framework/www
      - guarani_fw_temp:/opt/guarani/vendor/siu-toba/framework/temp
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost/guarani/3.23/"]
      interval: 30s
      timeout: 10s
      start_period: 600s
      retries: 10

  autogestion:
    build:
      context: .
      dockerfile: Dockerfile.3w
    container_name: guarani_3w
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      gestion:
        condition: service_started
    environment:
      TZ: America/Argentina/Buenos_Aires
      CHULUPI_BASE_NOMBRE: ${POSTGRES_DB}
      CHULUPI_BASE_HOST: db
      CHULUPI_BASE_PORT: "5432"
      CHULUPI_BASE_USER: ${POSTGRES_USER}
      CHULUPI_BASE_PASS: ${POSTGRES_PASSWORD}
      CHULUPI_BASE_SCHEMA: negocio
      CHULUPI_ALIAS: ${AUTOGESTION_ALIAS:-/3w}
      AUTOGESTION_UA: ${AUTOGESTION_UA:-5}
      AUTOGESTION_EMAIL_AYUDA: ${AUTOGESTION_EMAIL_AYUDA:-soporte@example.edu.ar}
      URL_GESTION: "http://localhost:${GESTION_PORT}/guarani/3.23"
      URL_3W: "http://localhost:${W3_PORT:-8091}${AUTOGESTION_ALIAS:-/3w}"
      DOCKER_WAIT_FOR: "1"
    ports:
      - "${W3_PORT:-8091}:80"
    volumes:
      - guarani_3w_instalacion:/opt/guarani-3w/instalacion
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost${AUTOGESTION_ALIAS:-/3w}/"]
      interval: 30s
      timeout: 10s
      start_period: 300s
      retries: 10

  preinscripcion:
    build:
      context: .
      dockerfile: Dockerfile.preinscripcion
    container_name: guarani_preinscripcion
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: America/Argentina/Buenos_Aires
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      PREINSCRIPCION_DB: preinscripcion
      GESTION_DB: ${POSTGRES_DB}
      PREINSCRIPCION_PORT: ${PREINSCRIPCION_PORT:-8092}
      PREINSCRIPCION_PTO: ${PREINSCRIPCION_PTO:-iupa}
      AUTOGESTION_EMAIL_AYUDA: ${AUTOGESTION_EMAIL_AYUDA:-soporte@example.edu.ar}
      PREINSCRIPCION_ADMIN_USER: ${PREINSCRIPCION_ADMIN_USER:-admin}
      PREINSCRIPCION_ADMIN_PASSWORD: ${PREINSCRIPCION_ADMIN_PASSWORD:-admin123}
      URL_PREINSCRIPCION: "http://localhost:${PREINSCRIPCION_PORT:-8092}/preinscripcion/${PREINSCRIPCION_PTO:-iupa}"
      URL_GESTION: "http://localhost:${GESTION_PORT}/guarani/3.23"
    ports:
      - "${PREINSCRIPCION_PORT:-8092}:80"
    volumes:
      - guarani_preinscripcion_instalacion:/opt/preinscripcion/instalacion
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost/preinscripcion/${PREINSCRIPCION_PTO:-iupa}/"]
      interval: 30s
      timeout: 10s
      start_period: 300s
      retries: 10

volumes:
  guarani_pgdata:
  guarani_instalacion:
  guarani_www:
  guarani_temp:
  guarani_metadatos:
  guarani_fw_www:
  guarani_fw_temp:
  guarani_3w_instalacion:
  guarani_preinscripcion_instalacion:
